name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  SLN_FILE_PATH: Source/Terminals.sln

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup-msbuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore Packages
        run: nuget restore ${{ env.SLN_FILE_PATH }}
      - name: Install a SQL Server suite of tools
        uses: potatoqualitee/mssqlsuite@v2
        with:
          install: localdb
          show-log: true
      - name: Recreate test database from SQL script
        shell: pwsh
        run: |
          $src = Join-Path $PWD "Resources\Database"
          $script = Join-Path $src "Terminals_CreateDatabase_v3.0.sql"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -i $script
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "SELECT name, physical_name FROM sys.master_files WHERE database_id = DB_ID('TERMINALS')"
          $files = sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "SET NOCOUNT ON; SELECT physical_name FROM sys.master_files WHERE database_id = DB_ID('TERMINALS')" -W -s "|" | Select-String "\|"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "EXEC sp_detach_db 'TERMINALS'"
          foreach ($line in $files) {
            $parts = $line.ToString().Split("|")
            $physical = $parts[1].Trim()
            Write-Host "Copying $physical"
            if ($physical -like "*mdf") {
              Copy-Item $physical "$src\Terminals.mdf" -Force
            } elseif ($physical -like "*ldf") {
              Copy-Item $physical "$src\Terminals_log.LDF" -Force
            }
          }
          attrib -r "$src\Terminals.mdf"
          attrib -r "$src\Terminals_log.LDF"
          Write-Host "Verify recreated database is writable"
          $mdf = "$src\Terminals.mdf"
          $ldf = "$src\Terminals_log.LDF"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "CREATE DATABASE [Terminals_Verify] ON (FILENAME = N'$mdf'), (FILENAME = N'$ldf') FOR ATTACH"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "SELECT name, is_read_only FROM sys.databases WHERE name = 'Terminals_Verify'"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "EXEC sp_detach_db 'Terminals_Verify'"
      - name: Build solution
        run: msbuild ${{ env.SLN_FILE_PATH }} -t:rebuild -property:Configuration=Release
      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1.2
      - name: Diagnose deployed test database
        shell: pwsh
        run: |
          $bin = Join-Path $PWD "Source\Tests\bin\Release"
          Get-ChildItem $bin -Filter "Terminals*" | Format-Table Name, IsReadOnly, Length
          attrib -r "$bin\Terminals.mdf"
          attrib -r "$bin\Terminals_log.LDF"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "CREATE DATABASE [Terminals_Diag] ON (FILENAME = N'$(Join-Path $bin "Terminals.mdf")'), (FILENAME = N'$(Join-Path $bin "Terminals_log.LDF")') FOR ATTACH"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "SELECT name, is_read_only FROM sys.databases WHERE name = 'Terminals_Diag'"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "EXEC sp_detach_db 'Terminals_Diag'"
      - name: Test
        run: vstest.console.exe /logger:"trx;LogFileName=test_results.trx" Source\Tests\bin\Release\Tests.dll
      - name: Test Report
        uses: dorny/test-reporter@v1.6.0
        if: success() || failure()    # run this step even if previous step failed
        with:
          name: MSTests
          path: TestResults/test_results.trx
          reporter: dotnet-trx 
