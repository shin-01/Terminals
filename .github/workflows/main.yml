name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  SLN_FILE_PATH: Source/Terminals.sln

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup-msbuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore Packages
        run: nuget restore ${{ env.SLN_FILE_PATH }}
      - name: Install a SQL Server suite of tools
        uses: potatoqualitee/mssqlsuite@v2
        with:
          install: localdb
          show-log: true
      - name: Upgrade test database to LocalDB 2022 format
        shell: pwsh
        run: |
          $src = Join-Path $PWD "Resources\Database"
          $tmp = Join-Path $env:RUNNER_TEMP "dbupgrade"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Copy-Item "$src\Terminals.mdf" $tmp -Force
          Copy-Item "$src\Terminals_log.LDF" $tmp -Force
          Get-ChildItem $tmp | ForEach-Object { $_.IsReadOnly = $false }
          attrib -r "$tmp\Terminals.mdf"
          attrib -r "$tmp\Terminals_log.LDF"
          icacls $tmp /grant "${env:USERNAME}:(OI)(CI)F" | Out-Null
          Write-Host "Files in $($tmp):"
          Get-ChildItem $tmp | Format-Table Name, IsReadOnly, Length
          $mdf = "$tmp\Terminals.mdf"
          $ldf = "$tmp\Terminals_log.LDF"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "CREATE DATABASE [Terminals_TestUpgrade] ON (FILENAME = N'$mdf'), (FILENAME = N'$ldf') FOR ATTACH"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "IF DB_ID('Terminals_TestUpgrade') IS NOT NULL ALTER DATABASE [Terminals_TestUpgrade] SET READ_WRITE"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -d Terminals_TestUpgrade -Q "CHECKPOINT"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "SELECT name, is_read_only FROM sys.databases WHERE name = 'Terminals_TestUpgrade'"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "EXEC sp_detach_db 'Terminals_TestUpgrade'"
          Write-Host "Copying upgraded database back to repo"
          Copy-Item $mdf "$src\Terminals.mdf" -Force
          Copy-Item $ldf "$src\Terminals_log.LDF" -Force
          attrib -r "$src\Terminals.mdf"
          attrib -r "$src\Terminals_log.LDF"
          Write-Host "Verify copied back database is writable"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "CREATE DATABASE [Terminals_Verify] ON (FILENAME = N'$(Join-Path $src "Terminals.mdf")'), (FILENAME = N'$(Join-Path $src "Terminals_log.LDF")') FOR ATTACH"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "SELECT name, is_read_only FROM sys.databases WHERE name = 'Terminals_Verify'"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "EXEC sp_detach_db 'Terminals_Verify'"
      - name: Build solution
        run: msbuild ${{ env.SLN_FILE_PATH }} -t:rebuild -property:Configuration=Release
      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1.2
      - name: Diagnose deployed test database
        shell: pwsh
        run: |
          $bin = Join-Path $PWD "Source\Tests\bin\Release"
          Get-ChildItem $bin -Filter "Terminals*" | Format-Table Name, IsReadOnly, Length
          attrib -r "$bin\Terminals.mdf"
          attrib -r "$bin\Terminals_log.LDF"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "CREATE DATABASE [Terminals_Diag] ON (FILENAME = N'$(Join-Path $bin "Terminals.mdf")'), (FILENAME = N'$(Join-Path $bin "Terminals_log.LDF")') FOR ATTACH"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "SELECT name, is_read_only FROM sys.databases WHERE name = 'Terminals_Diag'"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "EXEC sp_detach_db 'Terminals_Diag'"
      - name: Test
        run: vstest.console.exe /logger:"trx;LogFileName=test_results.trx" Source\Tests\bin\Release\Tests.dll
      - name: Test Report
        uses: dorny/test-reporter@v1.6.0
        if: success() || failure()    # run this step even if previous step failed
        with:
          name: MSTests
          path: TestResults/test_results.trx
          reporter: dotnet-trx 
