name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  SLN_FILE_PATH: Source/Terminals.sln

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install a SQL Server suite of tools
        uses: potatoqualitee/mssqlsuite@v2
        with:
          install: localdb
          show-log: true
      - name: Setup-msbuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore Packages
        run: |
          nuget install Microsoft.VisualStudio.QualityTools.UnitTestFramework.Updated -Version 15.0.26228 -OutputDirectory Source/packages -ExcludeVersion
          nuget install EntityFramework -Version 5.0.0 -OutputDirectory Source/packages -ExcludeVersion
          msbuild ${{ env.SLN_FILE_PATH }} -t:restore -property:Configuration=Release
      - name: Recreate test database from creation script
        shell: pwsh
        run: |
          $src = Join-Path $PWD "Resources\Database"
          $script = Join-Path $src "Terminals_CreateDatabase_v3.0.sql"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -i $script
          $mdf = "C:\Users\runneradmin\TERMINALS.mdf"
          $ldf = "C:\Users\runneradmin\TERMINALS_log.ldf"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "EXEC sp_detach_db 'TERMINALS'"
          Copy-Item $mdf "$src\Terminals.mdf" -Force
          Copy-Item $ldf "$src\Terminals_log.LDF" -Force
          attrib -r "$src\Terminals.mdf"
          attrib -r "$src\Terminals_log.LDF"
          Write-Host "Recreated database files:"
          Get-ChildItem $src -Filter "Terminals*" | Format-Table Name, IsReadOnly, Length
      - name: Build solution
        run: msbuild ${{ env.SLN_FILE_PATH }} -t:rebuild -property:Configuration=Release -restore
      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1.2
      - name: Grant SQL Server write access to workspace files
        shell: pwsh
        run: |
          icacls "D:\a\Terminals\Terminals" /grant "Everyone:(OI)(CI)F" /T | Out-Null
          Write-Host "ACL granted on workspace"
      - name: Test
        run: vstest.console.exe Source\Tests\bin\Release\net48\Tests.dll /settings:Source\Tests\Tests.runsettings /logger:"trx;LogFileName=test_results.trx"
      - name: Diagnose - password upgrade tests only
        shell: pwsh
        run: |
          vstest.console.exe Source\Tests\bin\Release\net48\Tests.dll /settings:Source\Tests\Tests.runsettings /TestCaseFilter:"FullyQualifiedName~PasswordUpgradesTests" /logger:"trx;LogFileName=diag_password.trx"
          exit 0

      - name: Test Report
        uses: dorny/test-reporter@v1.6.0
        if: success() || failure()    # run this step even if previous step failed
        with:
          name: MSTests
          path: TestResults/test_results.trx
          reporter: dotnet-trx 
