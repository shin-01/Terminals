name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  SLN_FILE_PATH: Source/Terminals.sln

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup-msbuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore Packages
        run: nuget restore ${{ env.SLN_FILE_PATH }}
      - name: Build solution
        run: msbuild ${{ env.SLN_FILE_PATH }} -t:rebuild -property:Configuration=Release
      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1.2
      - name: Install a SQL Server suite of tools
        uses: potatoqualitee/mssqlsuite@v2
        with:
          install: localdb
          show-log: true
      - name: Upgrade test database to LocalDB 2022 format
        shell: pwsh
        run: |
          $mdf = Join-Path $PWD "Resources\Database\Terminals.mdf"
          $ldf = Join-Path $PWD "Resources\Database\Terminals_log.LDF"
          attrib -r $mdf
          attrib -r $ldf
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "CREATE DATABASE [Terminals_TestUpgrade] ON (FILENAME = N'$mdf'), (FILENAME = N'$ldf') FOR ATTACH"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "IF DB_ID('Terminals_TestUpgrade') IS NOT NULL BEGIN ALTER DATABASE [Terminals_TestUpgrade] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [Terminals_TestUpgrade]; END"
      - name: Test
        run: vstest.console.exe /logger:"trx;LogFileName=test_results.trx" Source\Tests\bin\Release\Tests.dll
      - name: Test Report
        uses: dorny/test-reporter@v1.6.0
        if: success() || failure()    # run this step even if previous step failed
        with:
          name: MSTests
          path: TestResults/test_results.trx
          reporter: dotnet-trx 
