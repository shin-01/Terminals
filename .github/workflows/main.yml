name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  SLN_FILE_PATH: Source/Terminals.sln

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install a SQL Server suite of tools
        uses: potatoqualitee/mssqlsuite@v2
        with:
          install: localdb
          show-log: true
      - name: Setup-msbuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore Packages
        run: nuget restore ${{ env.SLN_FILE_PATH }}
      - name: Recreate test database from creation script
        shell: pwsh
        run: |
          $src = Join-Path $PWD "Resources\Database"
          $script = Join-Path $src "Terminals_CreateDatabase_v3.0.sql"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -i $script
          $mdf = "C:\Users\runneradmin\TERMINALS.mdf"
          $ldf = "C:\Users\runneradmin\TERMINALS_log.ldf"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "EXEC sp_detach_db 'TERMINALS'"
          Copy-Item $mdf "$src\Terminals.mdf" -Force
          Copy-Item $ldf "$src\Terminals_log.LDF" -Force
          attrib -r "$src\Terminals.mdf"
          attrib -r "$src\Terminals_log.LDF"
          Write-Host "Recreated database files:"
          Get-ChildItem $src -Filter "Terminals*" | Format-Table Name, IsReadOnly, Length
      - name: Build solution
        run: msbuild ${{ env.SLN_FILE_PATH }} -t:rebuild -property:Configuration=Release
      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1.2
      - name: Diagnose deployed test database
        shell: pwsh
        run: |
          $bin = Join-Path $PWD "Source\Tests\bin\Release"
          Get-ChildItem $bin -Filter "Terminals*.mdf" | Format-Table Name, IsReadOnly, Length
          Get-ChildItem $bin -Filter "Terminals*.ldf" | Format-Table Name, IsReadOnly, Length
          $diag = Join-Path $env:RUNNER_TEMP "dbdiag"
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          Copy-Item "$bin\Terminals.mdf" $diag -Force
          Copy-Item "$bin\Terminals_log.LDF" $diag -Force
          Get-ChildItem $diag | ForEach-Object { $_.IsReadOnly = $false }
          $mdf = "$diag\Terminals.mdf"
          $ldf = "$diag\Terminals_log.LDF"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "CREATE DATABASE [Terminals_Diag] ON (FILENAME = N'$mdf'), (FILENAME = N'$ldf') FOR ATTACH"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "SELECT name, is_read_only FROM sys.databases WHERE name = 'Terminals_Diag'"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -d Terminals_Diag -Q "UPDATE dbo.Options SET Value = Value WHERE PropertyName = 'MasterPasswordKey'; SELECT @@ROWCOUNT"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "EXEC sp_detach_db 'Terminals_Diag'"
      - name: Test
        run: vstest.console.exe /logger:"trx;LogFileName=test_results.trx" Source\Tests\bin\Release\Tests.dll
      - name: Test Report
        uses: dorny/test-reporter@v1.6.0
        if: success() || failure()    # run this step even if previous step failed
        with:
          name: MSTests
          path: TestResults/test_results.trx
          reporter: dotnet-trx 
